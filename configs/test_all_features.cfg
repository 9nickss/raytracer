camera:
{
    position = { x = 0.0; y = 0.0; z = 0.0; };
};

primitives:
{
    # Test des primitives standards
    spheres = (
        # Sphères de base
        { center = { x = -4.0; y = 1.0; z = -5.0; }; radius = 0.5; color = { r = 1.0; g = 0.0; b = 0.0; }; },
        { center = { x = 0.0; y = 1.0; z = -5.0; }; radius = 0.5; color = { r = 0.0; g = 1.0; b = 0.0; }; },
        { center = { x = 4.0; y = 1.0; z = -5.0; }; radius = 0.5; color = { r = 0.0; g = 0.0; b = 1.0; }; }
    );
    
    planes = (
        # Sol
        { point = { x = 0.0; y = -1.0; z = 0.0; }; normal = { x = 0.0; y = 1.0; z = 0.0; }; color = { r = 0.8; g = 0.8; b = 0.8; }; },
        
        # Mur arrière
        { point = { x = 0.0; y = 0.0; z = -8.0; }; normal = { x = 0.0; y = 0.0; z = 1.0; }; color = { r = 0.3; g = 0.3; b = 0.3; }; }
    );
    
    # Test des cylindres standards
    cylinders = (
        { center = { x = -2.0; y = 0.5; z = -4.0; }; radius = 0.3; color = { r = 1.0; g = 1.0; b = 0.0; }; }
    );
    
    # Test des cônes standards (infinis en hauteur)
    cones = (
        # Cone normal infini (pour comparaison avec limited_cone)
        { apex = { x = -2.0; y = 1.0; z = -3.5; }; radius = 0.4; height = 2.0; color = { r = 0.8; g = 0.0; b = 0.8; }; }
    );
    
    # Test des cylindres limités (NEW FEATURE) - au milieu de la scène
    limited_cylinders = (
        # Cylindre limité bleu
        { center = { x = -0.5; y = 0.0; z = -4.0; }; radius = 0.25; height = 1.5; color = { r = 0.0; g = 0.5; b = 1.0; }; rotation = { x = 0.0; y = 0.0; z = 0.0; }; },
        
        # Cylindre limité avec rotation (45 degrés autour X)
        { center = { x = 0.5; y = 0.0; z = -4.0; }; radius = 0.25; height = 1.5; color = { r = 0.5; g = 1.0; b = 0.5; }; rotation = { x = 45.0; y = 0.0; z = 0.0; }; }
    );
    
    # Test des cônes limités (NEW FEATURE) - comparaison côte à côte avec cone normal
    limited_cones = (
        # Limited cone - s'arrête à height=1.0 (height limitée)
        { apex = { x = 0.0; y = 1.0; z = -3.5; }; radius = 0.4; height = 1.0; color = { r = 1.0; g = 0.5; b = 0.0; }; rotation = { x = 0.0; y = 0.0; z = 0.0; }; },
        
        # Limited cone avec rotation
        { apex = { x = 2.0; y = 1.0; z = -3.5; }; radius = 0.4; height = 1.2; color = { r = 0.5; g = 0.0; b = 1.0; }; rotation = { x = 0.0; y = 30.0; z = 0.0; }; }
    );
};

lights:
{
    # Lumières ambiantes standard
    ambient = (
        { intensity = 0.2; }
    );
    
    # Lumières directionnelles standard
    directional = (
        { direction = { x = 0.5; y = -1.0; z = -1.0; }; intensity = 0.8; }
    );
    
    # Lumières ponctuelles colorées (NEW FEATURE - colored lights)
    colored_lights = (
        # Lumière rouge depuis la gauche
        { direction = { x = -1.0; y = 0.0; z = -1.0; }; color = { r = 1.0; g = 0.0; b = 0.0; }; intensity = 0.5; },
        
        # Lumière verte depuis la droite
        { direction = { x = 1.0; y = 0.0; z = -1.0; }; color = { r = 0.0; g = 1.0; b = 0.0; }; intensity = 0.5; },
        
        # Lumière bleue depuis le haut
        { direction = { x = 0.0; y = 1.0; z = -1.0; }; color = { r = 0.0; g = 0.0; b = 1.0; }; intensity = 0.3; }
    );
    
    # Lumières ponctuelles (NEW FEATURE - point lights)
    point_lights = (
        # Point light blanc au-dessus de la scène
        { position = { x = 0.0; y = 3.0; z = -4.0; }; intensity = 1.0; },
        
        # Point light supplémentaire pour l'éclairage d'appoint
        { position = { x = -3.0; y = 2.0; z = -2.0; }; intensity = 0.6; }
    );
};
