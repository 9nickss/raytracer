        { intensity = 0.1; }
    );
    
    # Lumière directionnelle rougeoyante
    directional = (
        { direction = { x = 0.3; y = -1.8; z = -0.3; }; intensity = 0.7; }
    );
    
    # Lumières RGB dystopiques - rouge/bleu dominant
    colored_lights = (
        # Lumière rouge intense
        { direction = { x = -1.2; y = -0.8; z = -1.0; }; color = { r = 1.0; g = 0.1; b = 0.0; }; intensity = 0.6; },
        
        # Lumière bleue inquiétante
        { direction = { x = 1.2; y = -0.6; z = -1.0; }; color = { r = 0.0; g = 0.2; b = 1.0; }; intensity = 0.5; },
        
        # Teinte verte toxique
        { direction = { x = 0.0; y = -1.0; z = -1.5; }; color = { r = 0.0; g = 0.7; b = 0.3; }; intensity = 0.25; }
