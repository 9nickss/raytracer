camera:
{
    position = { x = 0.0; y = 0.0; z = 0.0; };
};

primitives:
{
    # Sphères principales - disposition symétrique
    spheres = (
        # Centre - sphère dorée grande
        { center = { x = 0.0; y = 1.0; z = -4.5; }; radius = 0.8; color = { r = 1.0; g = 0.84; b = 0.0; }; },
        
        # Paire avant - rouge et cyan
        { center = { x = -1.5; y = 1.5; z = -3.5; }; radius = 0.6; color = { r = 1.0; g = 0.2; b = 0.2; }; },
        { center = { x = 1.5; y = 1.5; z = -3.5; }; radius = 0.6; color = { r = 0.2; g = 1.0; b = 1.0; }; },
        
        # Paire arrière - vert et magenta
        { center = { x = -1.2; y = 0.8; z = -5.5; }; radius = 0.5; color = { r = 0.2; g = 1.0; b = 0.2; }; },
        { center = { x = 1.2; y = 0.8; z = -5.5; }; radius = 0.5; color = { r = 1.0; g = 0.2; b = 1.0; }; },
        
        # Petites sphères de détail
        { center = { x = -2.5; y = 2.0; z = -3.0; }; radius = 0.3; color = { r = 1.0; g = 0.5; b = 0.0; }; },
        { center = { x = 2.5; y = 2.0; z = -3.0; }; radius = 0.3; color = { r = 0.0; g = 0.5; b = 1.0; }; }
    );
    
    planes = (
        # Sol élégant
        { point = { x = 0.0; y = -1.0; z = 0.0; }; normal = { x = 0.0; y = 1.0; z = 0.0; }; color = { r = 0.9; g = 0.9; b = 0.9; }; },
        
        # Mur arrière avec dégradé de profondeur
        { point = { x = 0.0; y = 0.0; z = -7.0; }; normal = { x = 0.0; y = 0.0; z = 1.0; }; color = { r = 0.2; g = 0.2; b = 0.3; }; }
    );
    
    cylinders = ();
    cones = ();
    
    # Cylindres limités - colonnes stylisées
    limited_cylinders = (
        # Colonne bleue gauche
        { center = { x = -2.5; y = 0.0; z = -4.0; }; radius = 0.2; height = 1.8; color = { r = 0.0; g = 0.3; b = 0.8; }; rotation = { x = 0.0; y = 0.0; z = 0.0; }; },
        
        # Colonne dorée centre-gauche
        { center = { x = -0.8; y = 0.0; z = -4.0; }; radius = 0.2; height = 2.0; color = { r = 0.9; g = 0.75; b = 0.0; }; rotation = { x = 0.0; y = 0.0; z = 0.0; }; },
        
        # Colonne verte centre-droite
        { center = { x = 0.8; y = 0.0; z = -4.0; }; radius = 0.2; height = 1.6; color = { r = 0.0; g = 0.8; b = 0.3; }; rotation = { x = 0.0; y = 0.0; z = 0.0; }; },
        
        # Colonne rouge droite
        { center = { x = 2.5; y = 0.0; z = -4.0; }; radius = 0.2; height = 1.9; color = { r = 0.9; g = 0.0; b = 0.1; }; rotation = { x = 0.0; y = 0.0; z = 0.0; }; }
    );
    
    # Cônes limités - pyramides stylisées
    limited_cones = (
        # Cône violet centre-gauche
        { apex = { x = -0.8; y = 2.2; z = -3.8; }; radius = 0.35; height = 1.2; color = { r = 0.7; g = 0.2; b = 0.8; }; rotation = { x = 0.0; y = 0.0; z = 0.0; }; },
        
        # Cône cyan centre-droite
        { apex = { x = 0.8; y = 2.0; z = -3.8; }; radius = 0.35; height = 1.0; color = { r = 0.2; g = 0.8; b = 0.9; }; rotation = { x = 0.0; y = 45.0; z = 0.0; }; }
    );
};

lights:
{
    # Éclairage ambiant discret
    ambient = (
        { intensity = 0.15; }
    );
    
    # Lumière directionnelle principale
    directional = (
        { direction = { x = 1.0; y = -2.0; z = -1.0; }; intensity = 0.9; }
    );
    
    # Lumières colorées - RGB setup classique
    colored_lights = (
        # Lumière rouge depuis la gauche
        { direction = { x = -1.5; y = -1.0; z = -2.0; }; color = { r = 1.0; g = 0.0; b = 0.0; }; intensity = 0.4; },
        
        # Lumière verte depuis la droite
        { direction = { x = 1.5; y = -1.0; z = -2.0; }; color = { r = 0.0; g = 1.0; b = 0.0; }; intensity = 0.4; },
        
        # Lumière bleue depuis le haut
        { direction = { x = 0.0; y = 1.5; z = -1.5; }; color = { r = 0.0; g = 0.0; b = 1.0; }; intensity = 0.35; }
    );
    
    # Point lights - accents lumineux
    point_lights = (
        # Point light blanc doré au-dessus
        { position = { x = 0.0; y = 3.5; z = -4.5; }; intensity = 1.2; },
        
        # Point light d'appoint latéral gauche
        { position = { x = -3.0; y = 1.5; z = -2.5; }; intensity = 0.6; },
        
        # Point light d'appoint latéral droit
        { position = { x = 3.0; y = 1.5; z = -2.5; }; intensity = 0.6; }
    );
};
